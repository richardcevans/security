schema_version: 1
id: deep_data_security
title: Deep Sec Demo Setup

branding:
  header: Deep Sec Demo Setup
  footer: Deep Sec Administrator Console · Oracle Database is the authorization boundary

# Executable and learner-display SQL lives beside this lesson manifest.
script_root: database

overview:
  introduction: "In this lab, you configure access for the Customer Sales App. Oracle AI Database enforces the rows and columns each signed-in end user can access. Review the scenario, then select Start DB Setup."
  scenario_heading: "The scenario"
  scenario: "Marvin is a salesperson and end user of the Customer Sales App. Emma is a second salesperson you will use as a comparison. You will start with broad baseline access, then use Oracle Deep Data Security to narrow Marvin's rows and columns and later extend his access as a manager."
  architecture_alt: "A browser connects to Admin Console and Customer Sales App on an OCI Compute VM. Both applications connect to Autonomous Database, which enforces Deep Sec data grants. Autonomous Database reads Iceberg order history files from OCI Object Storage."
  architecture_caption: "Oracle Database is the authorization boundary: the applications request data, while Deep Sec data grants determine the rows and columns returned."
  heading: "What you will do"
  stage_heading: "Stage"
  description_heading: "What you will do"
  time_heading: "Estimated time"
  total_label: "Total"
  stages:
    - label: "DB Setup"
      description: "Create the APPLAB schema, customer data, and ordinary database roles for login and external-table directory access."
      estimated_minutes: 5
    - label: "Deep Sec Setup"
      description: "Create Deep Sec data roles, a data grant, and local end users Marvin and Emma. Assign their starting access."
      estimated_minutes: 10
    - label: "Customer Sales App"
      description: "See the rows and columns Oracle returns for the signed-in user."
      estimated_minutes: 5
    - label: "Customize Grant"
      description: "Narrow Marvin's customer access, then confirm the change in the Customer Sales App."
      estimated_minutes: 10
    - label: "Context"
      description: "Build the manager context and define manager-level access."
      estimated_minutes: 10
    - label: "Iceberg"
      description: "Inspect Iceberg files in Object Storage, create the external table, and extend the data grant."
      estimated_minutes: 10
    - label: "Exercises"
      description: "Put Deep Sec to work through hands-on exercises."
      estimated_minutes: 5
    - label: "Best Practices"
      description: "Apply Deep Sec principles at enterprise scale with trusted identity, least privilege, controlled context, and policy lifecycle management."
      estimated_minutes: 5
  note: "Use the navigation links at any time. Pending steps are gray, the selected unfinished step is red, and completed steps are blue. Complete each action and its quiz, where shown, to finish the step. For observation steps, select Mark as viewed. Page check marks appear when all steps are complete. Progress is retained in the current Admin Console session; a new sign-in starts a fresh progress record. Review actions inspect database objects without changing them."
  start_path: /db-setup
  start_label: "Start DB Setup"

tour:
  - selector: '.header-link[href="/db-setup"]'
    title: "DB Setup"
    text: "Start here. Create the schema, customer table, and ordinary Oracle roles for login and external-table directory access before configuring Deep Sec."
  - selector: '.header-link[href="/deep-sec-basics"]'
    title: "Deep Sec Setup"
    text: "Create the data roles, the baseline data grant, and local end users Marvin and Emma. Then assign their starting access."
  - selector: '.header-link[href="/customer-sales"]'
    title: "Customer Sales App"
    text: "Open the application that Marvin and Emma sign in to. Return after each policy change to compare their authorized results."
  - selector: '.header-link[href="/build-grant"]'
    title: "Customize Data Grant"
    text: "Build employee access by choosing which columns the shared employee data grant authorizes and whether each salesperson sees only their own rows."
  - selector: '.header-link[href="/end-user-context"]'
    title: "End User Context"
    text: "Create a manager lookup and session-scoped context, then grant Marvin the manager data role."
  - selector: '.header-link[href="/order-history"]'
    title: "Iceberg"
    text: "See an Apache Iceberg table from three angles: raw Object Storage files, an Oracle external table over its metadata, and a cross-table data grant that limits which order rows each user can see."
  - selector: '.header-link[href="/exercises"]'
    title: "Exercises"
    text: "Switch between these exercises and the Customer Sales App to verify the policies from the signed-in user's perspective, including AI Insights."
  - selector: '.header-link[href="/best-practices"]'
    title: "Best Practices"
    text: "See how the patterns in this lab extend to enterprise applications: trusted identity, minimally privileged connections, precise grants, controlled context, and policy lifecycle management."
  - selector: '.header-link[href="/summary"]'
    title: "Summary"
    text: "Compare the baseline, employee, manager, and Iceberg results, then review what each authorization policy changed."
  - selector: '.header-link[href="/admin"]'
    title: "Admin"
    text: "Run validation queries, download the installed source, or restore and reset the lab database objects."

actions:
  prepare_applab:
    type: sql
    title: Prepare APPLAB
    description: Creates the APPLAB schema and customer table, then loads the 22 sample records used throughout the lab.
    scripts:
      - create_schema.sql
      - load_sample_data.sql
    destructive: true
    internal_secret_script: create_schema.sql
    short_label: Prepare App
    output_title: Complete SQL*Plus output

  create_db_roles:
    type: sql
    title: Create database role
    description: "Creates HOL_DBROLE_CONNECT for CREATE SESSION and HOL_DBROLE_ORDER_HISTORY_QUERY for external-table directory access. Ordinary database roles carry these privileges to Deep Sec data roles; the later data grants control access to table data."
    scripts:
      - create_db_roles.sql
    destructive: true
    requires:
      - prepare_applab
    short_label: Create DB Role
    output_title: Complete SQL*Plus output

  review_db_setup:
    type: sql
    title: Review
    description: "Confirms the schema, customer table, and login role created on this page. Deep Data Security setup begins on the next page."
    scripts:
      - db_setup_status.sql
    short_label: Review
    output_title: Complete SQL*Plus output

  create_roles:
    type: sql
    title: Create data roles
    description: "Creates HOL_DATAROLE_EMPLOYEE_ACCESS and HOL_DATAROLE_MANAGER_ACCESS. The employee data role receives the ordinary database roles needed for login and external-table directory access. The next step defines its access to customer data."
    scripts:
      - create_data_roles.sql
    destructive: true
    requires:
      - create_db_roles
    short_label: Create data roles
    output_title: Complete SQL*Plus output

  create_data_grants:
    type: sql
    title: Create data grants
    description: "Defines the employee data grant wide open: every row and every column. The Customize Data Grant page narrows it later."
    scripts:
      - create_data_grants.sql
    destructive: true
    requires:
      - create_roles
    short_label: Create data grants
    output_title: Complete SQL*Plus output

  create_end_users:
    type: sql
    title: Create end users
    description: Creates Marvin and Emma together. Emma receives HOL_DATAROLE_EMPLOYEE_ACCESS; a separate action grants that data role to Marvin.
    scripts:
      - create_end_users.sql
    destructive: true
    needs_password: true
    requires:
      - create_data_grants
    short_label: Create end users
    output_title: Complete SQL*Plus output

  grant_employee_access:
    type: sql
    title: Grant employee access
    description: "Grants HOL_DATAROLE_EMPLOYEE_ACCESS to Marvin and confirms it for Emma. Its initial data grant authorizes all customer rows and columns until you customize it."
    scripts:
      - grant_employee_access.sql
    destructive: true
    requires:
      - create_end_users
    short_label: Grant employee access
    output_title: Complete SQL*Plus output

  customer_sales:
    type: link
    title: Customer Sales App
    description: "Open the Customer Sales App, sign in as Marvin with the shared lab password, and select Customer Report. Return here to complete the quiz."
    requires:
      - grant_employee_access
    link_target: customer_sales_app
    completion: mark_viewed
    short_label: Customer Sales App
    config:
      additional_link:
        title: Customer Sales App as Emma
        description: "Right-click the link below and open it in an Incognito (Chrome), InPrivate (Edge), or private browsing window. Sign in as Emma using the same lab password, then select Customer Report. Keep Marvin's original window open to compare their access. If your browser does not offer that menu option, copy the link and paste it into a new private window."
        button_label: Right-click for Emma

  review_light:
    type: sql
    title: Review
    description: "Confirms the data roles, baseline employee data grant, and end users. The initial grant authorizes every customer row and column."
    scripts:
      - end_user_status_light.sql
    short_label: Review
    output_title: Complete SQL*Plus output

  review_grant:
    type: sql
    title: Review
    description: Confirms the employee data grant after you customize it, including the selected rows, columns, and privileges.
    scripts:
      - end_user_status_light.sql
    short_label: Review
    output_title: Complete SQL*Plus output

  review_context:
    type: sql
    title: Review
    description: Confirms the manager context, customer data grants, and Marvin's role assignments after the Context steps.
    scripts:
      - end_user_status_light.sql
    short_label: Review
    output_title: Complete SQL*Plus output

  create_managers:
    type: sql
    title: Create managers
    description: Creates a small lookup table resolving each manager's own numeric ID.
    scripts:
      - create_managers.sql
    destructive: true
    requires:
      - create_end_users
    short_label: Manager Lookup
    output_title: Complete SQL*Plus output

  create_manager_context:
    type: sql
    title: Create context
    description: Creates the session-scoped end user context and its package, resolving the authenticated manager's own ID.
    scripts:
      - create_manager_context.sql
    destructive: true
    requires:
      - create_managers
    short_label: Create Context
    output_title: Complete SQL*Plus output

  set_context:
    type: sql
    title: Set Context
    description: Grants APPLAB permission to update end user contexts, creates the bridge role, and authorizes both data roles to read the context object.
    scripts:
      - set_context.sql
    destructive: true
    requires:
      - create_manager_context
    short_label: Set Context
    output_title: Complete SQL*Plus output

  enable_manager:
    type: sql
    title: Grant manager role
    description: "Grants HOL_DATAROLE_MANAGER_ACCESS to Marvin while preserving his employee data role. Oracle combines the access authorized by both roles."
    scripts:
      - promote_marvin_to_manager.sql
    destructive: true
    requires:
      - customize_manager_grant
    short_label: Grant manager role
    output_title: Complete SQL*Plus output

  disable_manager:
    type: sql
    title: Revoke manager role
    description: "Revokes HOL_DATAROLE_MANAGER_ACCESS from Marvin. The manager data grant remains defined but no longer authorizes access for him through that role."
    scripts:
      - disable_manager_policy.sql
    destructive: true
    requires:
      - create_end_users
    short_label: Revoke manager role
    output_title: Complete SQL*Plus output

  customize_employee_grant:
    type: wizard
    handler: data_grant
    title: Customize the employee grant
    description: Choose the columns Marvin's employee data role can retrieve, which selected columns can be updated, whether rows are restricted to his sales_rep, and whether DELETE is allowed.
    requires:
      - create_data_grants
      - create_end_users
    short_label: Customize employee
    confirm_apply: false
    output_title: SQL*Plus output
    config:
      title: Columns Marvin's employee data role can see
      grant_name: APPLAB.employee_customer_access
      role: hol_datarole_employee_access
      table: APPLAB.customers
      required_columns:
        - customer_id
      optional_columns:
        - sales_rep
        - customer_name
        - region
        - revenue
        - credit_limit
        - sensitive_identifier
      updatable_columns:
        - sales_rep
        - customer_name
        - region
        - revenue
        - credit_limit
        - sensitive_identifier
      row_restriction:
        mode: toggle
        predicate: upper(sales_rep) = upper(ora_end_user_context.username)
      row_restriction_option:
        label: Restrict rows to your own sales_rep
      allow_delete_option:
        label: Also allow deleting rows
      columns:
        - key: customer_id
          label: customer_id
          required: true
          note: always included, primary key
        - key: sales_rep
          label: sales_rep
          required: false
          default: true
          allow_update: true
        - key: customer_name
          label: customer_name
          required: false
          default: true
          allow_update: true
        - key: region
          label: region
          required: false
          default: true
          allow_update: true
        - key: revenue
          label: revenue
          required: false
          default: true
          allow_update: true
        - key: credit_limit
          label: credit_limit
          required: false
          default: true
          allow_update: true
        - key: sensitive_identifier
          label: sensitive_identifier
          required: false
          default: true
          allow_update: true

  verify_employee_grant:
    type: link
    title: Check Customer Sales App
    description: You already have the Customer Sales App open in another tab. Go there now and select Customer Report again.
    link_button_label: Mark as viewed
    completion: mark_viewed
    short_label: Check Customer Sales App

  customize_manager_grant:
    type: wizard
    handler: data_grant
    title: Create the manager data grant
    description: Create the data grant associated with the manager data role. Choose the columns the manager can see and update, then decide whether the manager can delete rows. The following step grants the manager data role to MARVIN.
    requires:
      - create_manager_context
      - set_context
    short_label: Manager Data Grant
    confirm_apply: false
    output_title: SQL*Plus output
    config:
      title: Columns Marvin's manager role can see
      grant_name: APPLAB.manager_customer_access
      role: hol_datarole_manager_access
      table: APPLAB.customers
      required_columns:
        - customer_id
        - manager_id
      optional_columns:
        - customer_name
        - region
        - sales_rep
        - revenue
        - credit_limit
        - sensitive_identifier
      updatable_columns:
        - customer_name
        - region
        - sales_rep
        - revenue
        - credit_limit
        - sensitive_identifier
      row_restriction:
        mode: fixed
        predicate: manager_id = ora_end_user_context.APPLAB.MGR_CTX.id
      allow_delete_option:
        label: Also allow deleting rows
      columns:
        - key: customer_id
          label: customer_id
          required: true
          note: always included, primary key
        - key: manager_id
          label: manager_id
          required: true
          note: always included, identifies the row's manager
        - key: customer_name
          label: customer_name
          required: false
          default: true
          allow_update: true
        - key: region
          label: region
          required: false
          default: true
          allow_update: true
        - key: sales_rep
          label: sales_rep
          required: false
          default: true
          allow_update: true
        - key: revenue
          label: revenue
          required: false
          default: true
          allow_update: true
        - key: credit_limit
          label: credit_limit
          required: false
          default: true
          allow_update: true
        - key: sensitive_identifier
          label: sensitive_identifier
          required: false
          default: true
          allow_update: true

  explain_iceberg_architecture:
    type: explanation
    title: How Iceberg works
    description: "Follow the metadata files Oracle reads to locate the Iceberg data. The final files contain the order rows."
    completion: mark_viewed
    short_label: How it works
    output_title: Step status
    config:
      asset: iceberg-hierarchy.svg
      button_label: Mark as viewed

  show_iceberg_files:
    type: object_storage
    handler: iceberg_files
    title: See the raw data
    description: "Lists the files behind ORDER_HISTORY and displays the current metadata JSON directly from Object Storage."
    short_label: See the raw data
    output_title: Object Storage output
    config:
      bucket_setting: order_history_bucket
      namespace_setting: order_history_namespace
      region_setting: genai_region
      prefix_setting: order_history_prefix
      read_par_url_setting: order_history_read_par_url
      metadata_read_par_url_setting: order_history_metadata_read_par_url

  create_order_history:
    type: sql
    title: Create external table
    description: APPLAB creates the external table over the published Iceberg metadata in private Object Storage. Oracle derives the Iceberg columns and does not copy data. No data grant exists yet.
    scripts:
      - create_order_history_table.sql
    database_user: APPLAB
    destructive: true
    requires:
      - create_manager_context
    short_label: Create table
    output_title: Complete SQL*Plus output

  show_order_history_data:
    type: sql
    title: See the Iceberg data
    description: "Queries ORDER_HISTORY with ordinary SQL. The external table reads the existing files in Object Storage without copying them into database storage."
    scripts:
      - show_order_history_data.sql
    requires:
      - create_order_history
    short_label: See the data
    output_title: Complete SQL*Plus output

  extend_manager_context:
    type: wizard
    handler: data_grant
    title: Extend customer access
    description: "Choose which order-history columns the cross-table data grant excludes from SELECT. Select the AMOUNT checkbox to exclude that column, then apply the grant. Access to matching customer rows determines which order rows each end user can read."
    requires:
      - create_order_history
      - set_context
    short_label: Extend access
    confirm_apply: false
    output_title: SQL*Plus output
    config:
      style: all_except
      mode: all_except
      grant_name: APPLAB.order_history_by_customer_access
      table: APPLAB.order_history
      when_select: APPLAB.customers
      predicate: APPLAB.order_history.customer_id = APPLAB.customers.customer_id
      optional_columns:
        - order_id
        - order_date
        - sales_rep
        - product_category
        - amount
      columns:
        - key: order_id
          label: order_id
        - key: order_date
          label: order_date
        - key: sales_rep
          label: sales_rep
        - key: product_category
          label: product_category
        - key: amount
          label: amount

  review_order_history:
    type: sql
    title: Review
    description: Reviews the order-history data grant, its predicate, and the current role assignments.
    scripts:
      - end_user_status_light.sql
    short_label: Review
    output_title: Complete SQL*Plus output

  exercise_persona_compare:
    type: link
    title: Compare Emma and Marvin
    description: "Use Emma's private browser window and Marvin's original window. Select Customer Report in each and compare their rows and columns."
    link_button_label: Mark as viewed
    completion: mark_viewed
    short_label: Compare personas

  exercise_ai_insights:
    type: link
    title: Ask AI Insights
    description: "While signed in as Marvin or Emma, open AI Insights and ask a broad customer question, such as \"List every customer.\" Select Generate Insights once and wait for the result."
    link_button_label: Mark as viewed
    completion: mark_viewed
    short_label: Ask AI Insights

  exercise_order_history_before_after:
    type: link
    title: Order history, before and after
    description: "Recall the result before the cross-table data grant existed. Then select Iceberg Report as Marvin and compare the current result. If you skipped the grant, create it on the Iceberg page first."
    link_button_label: Mark as viewed
    completion: mark_viewed
    short_label: Order history before/after

  exercise_manager_promotion:
    type: link
    title: Promote Marvin, then compare
    description: "On Context, revoke Marvin's manager role and refresh Customer Report to check his employee access. Grant the manager role again and refresh the report to compare. Leave the manager role granted for the remaining comparisons."
    link_button_label: Mark as viewed
    completion: mark_viewed
    short_label: Compare before/after promotion

  exercise_reset:
    type: link
    title: Use a restore option
    description: "Review the two restore options on Admin. If you choose to run one, it resets your progress and replaces the lab database objects. Restore to DB Setup removes Marvin and Emma; complete Deep Sec Setup before signing in again. Restore to Deep Sec Setup recreates both users with broad baseline access."
    link_button_label: Mark as viewed
    completion: mark_viewed
    short_label: Try a restore

  best_practice_authorization_model:
    type: explanation
    title: Design the authorization model before implementing policies
    description: "Define who can access what data, which operations they can perform, and under what conditions. Translate those requirements into data roles and data grants so policies stay aligned with business rules instead of becoming one-off grants."
    completion: mark_viewed
    short_label: Design the model
    output_title: Step status
    config:
      asset: best-practice-authorization-model.svg
      asset_alt: "Business requirements flow into an authorization model and then into Deep Data Security data roles, data grants, and tests."
      asset_caption: "Start with the business authorization model, then implement and test it with Deep Data Security."
      button_label: Mark as viewed

  best_practice_trusted_identity:
    type: explanation
    title: Use trusted identity and propagate the real end user to the database
    description: "Prefer enterprise IAM such as Entra ID or OCI IAM for production applications, and propagate the authenticated user's identity, roles, and attributes through the end-user security context. Authorization should be based on the actual user, not only the shared connection-pool account."
    completion: mark_viewed
    short_label: Trusted identity
    output_title: Step status
    config:
      asset: best-practice-trusted-identity.svg
      asset_alt: "Marvin authenticates through enterprise IAM, the Customer Sales App uses its registered application identity, and the database receives Marvin's end-user security context over a pooled connection."
      asset_caption: "Application identity identifies the calling application; the end-user security context tells Oracle that this request is for Marvin."
      button_label: Mark as viewed
      examples:
        - title: Remove the local lab end user
          language: SQL
          description: "After moving to IAM-managed users and ending any local Marvin session, remove the local Deep Sec end user. This does not delete Marvin from Entra ID or OCI IAM."
          code: |
            -- Run as an authorized Deep Sec administrator.
            DROP END USER marvin;
        - title: "Microsoft Entra ID: map both application roles"
          language: SQL
          description: "Create application roles named employee and manager in Microsoft Entra ID, assign them to Marvin, then create the database-side mappings below."
          code: |
            CREATE DATA ROLE employee_role
              MAPPED TO 'AZURE_ROLE=employee';

            CREATE DATA ROLE manager_role
              MAPPED TO 'AZURE_ROLE=manager';
        - title: "OCI IAM: map both groups"
          language: SQL
          description: "Create OCI IAM groups named employee and manager, add Marvin to the appropriate groups, then create the database-side mappings below."
          code: |
            CREATE DATA ROLE employee_role
              MAPPED TO 'IAM_OAUTH_GROUP=employee';

            CREATE DATA ROLE manager_role
              MAPPED TO 'IAM_OAUTH_GROUP=manager';

  best_practice_minimal_connections:
    type: explanation
    title: Keep application connections minimally privileged
    description: "Avoid broadly privileged service accounts. For user-mediated requests, the application connection should have only the privileges needed to connect and establish the end-user security context; access to application data should come from the user's data roles and data grants."
    completion: mark_viewed
    short_label: Minimize connections
    output_title: Step status
    config:
      asset: best-practice-minimal-connections.svg
      asset_alt: "A broad service account exposes all customer data, while a minimally privileged application connection establishes identity and lets Deep Data Security return only authorized data."
      asset_caption: "Keep the connection narrow and put data authorization in Deep Data Security."
      button_label: Mark as viewed
      examples:
        - title: "Microsoft Entra ID: register the Customer Sales App"
          language: SQL
          description: "Map the database application identity to the Entra application client ID. The placeholder is not a secret."
          code: |
            CREATE APPLICATION IDENTITY sales_app
              MAPPED TO 'AZURE_CLIENT_ID=<entra-sales-app-client-id>';
        - title: "OCI IAM: register the Customer Sales App"
          language: SQL
          description: "Map the database application identity to the OCI IAM OAuth client ID."
          code: |
            CREATE APPLICATION IDENTITY sales_app
              MAPPED TO 'IAM_OAUTH_CLIENT_ID=<oci-sales-app-client-id>';
        - title: Connection rule for user-mediated requests
          language: SQL
          description: "For a request on behalf of Marvin, the app establishes the end-user security context on the connection. The externally mapped employee and manager data roles come from Marvin's IAM claims; they are not granted to the local user."
          code: |
            -- Keep the connection role limited to connection and context setup.
            CREATE ROLE sales_app_connect_role;
            GRANT CREATE SESSION, CREATE END USER SECURITY CONTEXT
              TO sales_app_connect_role;

            -- Give the application identity only this local data role.
            CREATE DATA ROLE sales_app_logon_role;
            GRANT sales_app_connect_role TO sales_app_logon_role;
            GRANT DATA ROLE sales_app_logon_role TO sales_app;

  best_practice_least_privilege:
    type: explanation
    title: Apply least privilege at the row, column, and cell level
    description: "Make data grants as precise as the business requirement: specify which rows, which columns, and which operations such as SELECT, UPDATE, INSERT, or DELETE. Multiple applicable data grants are additive, so evaluate their combined effect."
    completion: mark_viewed
    short_label: Fine-grained access
    output_title: Step status
    config:
      asset: best-practice-least-privilege.svg
      asset_alt: "A Customer Sales table shows row, column, cell, and operation-level authorization, with sensitive cells excluded from the result."
      asset_caption: "Deep Data Security can express the exact rows, columns, cells, and operations the business rule allows."
      button_label: Mark as viewed
      examples:
        - title: "Employee access: own rows and no sensitive columns"
          language: SQL
          description: "The employee role can read Marvin's own salesperson rows, while credit_limit and sensitive_identifier are excluded."
          code: |
            CREATE DATA GRANT employee_customer_access
              AS SELECT (ALL COLUMNS EXCEPT credit_limit, sensitive_identifier)
              ON APPLAB.customers
              WHERE UPPER(sales_rep) = UPPER(ORA_END_USER_CONTEXT.username)
              TO employee_role;
        - title: "Manager access: context-driven rows"
          language: SQL
          description: "The manager role can read rows selected by the protected manager context."
          code: |
            CREATE DATA GRANT manager_customer_access
              AS SELECT
              ON APPLAB.customers
              WHERE manager_id = ORA_END_USER_CONTEXT.APPLAB.MGR_CTX.id
              TO manager_role;
        - title: Separate update authority from read authority
          language: SQL
          description: "If the business permits an employee to update revenue, grant that operation explicitly and keep it scoped to the same authorized rows."
          code: |
            CREATE DATA GRANT employee_customer_update
              AS UPDATE (revenue)
              ON APPLAB.customers
              WHERE UPPER(sales_rep) = UPPER(ORA_END_USER_CONTEXT.username)
              TO employee_role;

  best_practice_trusted_context:
    type: explanation
    title: Use trusted context and controlled elevation for complex authorization
    description: "Put business attributes such as employee ID, organization, or territory into protected end-user contexts when policies need them. For sensitive workflows, use controlled privilege elevation rather than permanently granting broad access to users or agents."
    completion: mark_viewed
    short_label: Trusted context
    output_title: Step status
    config:
      asset: best-practice-trusted-context.svg
      asset_alt: "Trusted employee and territory attributes flow into a protected end-user context, which a Deep Data Security predicate evaluates before a controlled elevation is approved."
      asset_caption: "Use trusted attributes for dynamic policy decisions and make exceptional elevation explicit, temporary, and auditable."
      button_label: Mark as viewed
      examples:
        - title: Use a trusted context attribute in a predicate
          language: SQL
          description: "The application supplies validated context attributes through the end-user security context; the data grant evaluates them in Oracle."
          code: |
            CREATE DATA GRANT manager_customer_access
              AS SELECT
              ON APPLAB.customers
              WHERE manager_id = ORA_END_USER_CONTEXT.APPLAB.MGR_CTX.id
              TO manager_role;
        - title: Keep elevation separate from ordinary access
          language: SQL
          description: "If an application needs a common, locally managed elevation role, grant only that narrowly defined role to the application identity and expose it through an approved workflow. Do not make it a permanent replacement for user authorization."
          code: |
            -- Illustrative: sales_approved_elevation is locally managed.
            GRANT DATA ROLE sales_approved_elevation TO sales_app;

  best_practice_policy_lifecycle:
    type: explanation
    title: Test, audit, and manage policies as code
    description: "Test authorized and unauthorized access, multi-role users, role changes, pooled connections, and different access paths. Audit data role and data grant administration, capture runtime SELECT and DML on protected objects, and use the Deep Data Security dictionary views plus UNIFIED_AUDIT_TRAIL to trace policy changes and data use to the administrator, application, and end user."
    completion: mark_viewed
    short_label: Test and govern
    output_title: Step status
    config:
      asset: best-practice-policy-lifecycle.svg
      asset_alt: "Deep Data Security policy definitions move from version control through CI/CD and testing into runtime enforcement, dictionary inspection, and audit evidence."
      asset_caption: "Enterprise authorization is a lifecycle: define, test, deploy, observe, and improve."
      button_label: Mark as viewed
      examples:
        - title: Review mapped data roles
          language: SQL
          description: "Confirm which database data roles are mapped to external IAM claims."
          code: |
            SELECT data_role, mapped_to
            FROM dba_data_roles
            WHERE data_role IN ('EMPLOYEE_ROLE', 'MANAGER_ROLE')
            ORDER BY data_role;
        - title: Review data grants
          language: SQL
          description: "Inspect the row, column, and operation-level grants deployed to the application schema."
          code: |
            SELECT grant_name, object_name, privilege, column_name
            FROM dba_data_grants
            WHERE object_owner = 'APPLAB'
            ORDER BY object_name, grant_name, column_name;
        - title: Audit Deep Data Security administration
          language: SQL
          description: "Capture data role creation, assignment, and removal, plus data grant creation, replacement, and removal. CREATE OR REPLACE DATA GRANT changes are recorded through the documented CREATE DATA GRANT audit action."
          code: |
            CREATE AUDIT POLICY deep_sec_admin_pol
              ACTIONS
                CREATE DATA ROLE,
                DROP DATA ROLE,
                GRANT DATA ROLE,
                REVOKE DATA ROLE,
                CREATE DATA GRANT,
                DROP DATA GRANT;

            AUDIT POLICY deep_sec_admin_pol;

            -- Later policy edits use the same audited data-grant action.
            CREATE OR REPLACE DATA GRANT employee_customer_access
              AS SELECT (ALL COLUMNS EXCEPT credit_limit, sensitive_identifier)
              ON APPLAB.customers
              WHERE UPPER(sales_rep) = UPPER(ORA_END_USER_CONTEXT.username)
              TO employee_role;
        - title: Audit role and grant runtime use
          language: SQL
          description: "Audit protected-object activity, then correlate each event with the end-user security context and current role/grant metadata."
          code: |
            CREATE AUDIT POLICY deep_sec_runtime_pol
              ACTIONS
                SELECT ON APPLAB.CUSTOMERS,
                INSERT ON APPLAB.CUSTOMERS,
                UPDATE ON APPLAB.CUSTOMERS,
                DELETE ON APPLAB.CUSTOMERS;

            AUDIT POLICY deep_sec_runtime_pol;

            SELECT event_timestamp,
                   dbusername,
                   end_user_name,
                   end_user_security_context_id,
                   action_name,
                   object_schema,
                   object_name,
                   sql_text,
                   return_code
            FROM unified_audit_trail
            WHERE (object_schema = 'APPLAB'
                   AND object_name = 'CUSTOMERS')
               OR action_name IN ('CREATE DATA ROLE', 'DROP DATA ROLE',
                                  'GRANT DATA ROLE', 'REVOKE DATA ROLE',
                                  'CREATE DATA GRANT', 'DROP DATA GRANT')
            ORDER BY event_timestamp DESC;

            SELECT data_role, grantee, grantee_type
            FROM dba_data_role_grants
            ORDER BY data_role, grantee;
        - title: Test the authorization contract
          language: text
          description: "Automate both allowed and denied paths for Marvin, Emma, multiple roles, role changes, pooled connections, and agent-assisted requests."
          code: |
            allowed:  Marvin reads his rows and approved columns
            denied:   Marvin cannot read excluded columns or other rows
            compare:  Emma's result remains independently attributable

  what_you_proved:
    type: explanation
    title: Summary
    description: "The application issued the same ordinary query throughout the lab. Oracle Deep Data Security changed the authorized result as the end user, data roles, grants, context, and cross-table relationship changed."
    completion: mark_viewed
    short_label: Summary
    output_title: Step status
    config:
      asset: lab-architecture.png
      asset_alt: "Architecture showing the Customer Sales App querying Oracle AI Database as the signed-in end user. Deep Data Security authorizes the returned data before the app sends it to OCI Generative AI."
      asset_caption: "The application queries Oracle as the signed-in end user. OCI Generative AI receives the authorized customer data; red-team SQL checks run through the application under the same end-user authorization."
      query: SELECT * FROM APPLAB.customers ORDER BY revenue DESC
      result_sets:
        - title: Baseline access
          description: "22 rows and 8 authorized columns in SQL. The Customer Report displays 7 columns; manager_id is not a report column."
        - title: Employee access
          description: "3 Marvin rows and 5 authorized columns with the recommended employee grant."
        - title: Manager access
          description: "9 rows: Marvin's 3 employee rows and Emma's 6 rows through his manager grant."
        - title: Iceberg
          description: "618 authorized orders for Marvin as manager. The Iceberg Report displays the 50 most recent orders and the total authorized count."
      takeaways:
        - The application sends ordinary SQL; Oracle decides which rows and columns the user can receive.
        - "Data roles and data grants authorize database access from the application, direct SQL, and the local SQL tool used by the GenAI red-team challenge."
        - End user context extends the end user's attributes stored in memory.
        - Cross-table data grants allow you to enforce parent/child table relationships.
        - "Deep Data Security protects the customer table and the supported Iceberg external table used in this lab."
      documentation_url: https://docs.oracle.com/en/database/oracle/oracle-database/26/ddscg/index.html
      button_label: Mark as viewed

  validate_as_marvin:
    type: sql
    title: Run Marvin validation queries
    description: Runs the same validation SQL as Marvin and shows the rows, context, and active data roles.
    scripts:
      - validation_queries.sql
    database_user: MARVIN
    requires:
      - create_end_users
    short_label: Run validation
    output_title: Complete SQL*Plus output
    config:
      validation_comparison: true
      query: SELECT * FROM APPLAB.customers ORDER BY revenue DESC

  restore_db_setup:
