steps:
  - id: prepare_applab
    badge: "1"
    label: Prepare App
    title: Prepare App
    action_ids:
      - prepare_applab
    next_hint: "Continue to Create DB Role to prepare login and external-table directory privileges."
    notes:
      - "Let us get started by creating the lab schema, modifying the database's network ACL to allow access to Object Storage, creating the CUSTOMERS table and loading sample data. All very routine stuff!"

  - id: create_db_roles
    badge: "2"
    label: Create DB Role
    title: Create DB Role
    action_ids:
      - create_db_roles
    next_hint: "Run Review & Quiz, then continue to Deep Sec Setup."
    notes:
      - "Right now you are just creating basic Oracle Database roles and grants you are probably already familiar with."
      - "One important thing to note: traditional system privileges cannot be granted directly to Deep Sec data roles. That is why you create this traditional database role, HOL_DBROLE_CONNECT, first."

  - id: review_setup
    badge: "3"
    label: Review & Quiz
    title: Review & Quiz
    action_ids:
      - review_db_setup
    next_hint: Continue to Deep Sec Setup to create the data roles and grants Marvin will use.
    quiz:
      question: Why did you grant CREATE SESSION to the HOL_DBROLE_CONNECT database role?
      options:
        - key: data_role
          label: Data roles can hold system privileges only after their first data grant.
        - key: database_role
          label: Data roles cannot receive system privileges directly, so the standard database role supplies the login privilege through the data role.
        - key: local_user
          label: Only local database users need CREATE SESSION; IAM users never need it.
        - key: admin
          label: CREATE SESSION must be granted directly to each end user by ADMIN.
      correct_answer: database_role
      explanation: Correct. HOL_DBROLE_CONNECT is the standard database-role bridge for CREATE SESSION; the data role carries that database role to the end user.
    notes:
      - "Each setup page ends with a review script and a quiz. Run the action, then check your answer. You can try again as often as needed. Next Step lets you continue, but the step stays unfinished until its action and quiz are complete."

  - id: create_roles
    badge: "1"
    label: Create data roles
    title: Create data roles
    action_ids:
      - create_roles
    next_hint: Run Create data grants to give these data roles something to actually authorize.
    notes:
      - "Data roles are a new Deep Sec concept. You create data grants for data roles, then assign those data roles to end users. The data grants define the permitted operations, rows, and columns."
      - "In your environment this role would be named for the job, such as SALES_EMPLOYEE or CLAIMS_ADJUSTER. The HOL_ prefix is only a lab convention."
      - "Data grants can name local end users directly, but assigning grants to data roles makes access easier to manage. Standard database roles cannot be grantees of a data grant. Here, the standard database roles instead supply login and directory privileges to HOL_DATAROLE_EMPLOYEE_ACCESS."
      - "Data roles can also map to OCI IAM groups or Microsoft Entra ID application roles. You then manage membership in the identity provider and map those claims to data roles in Oracle AI Database."
      - "CREATE OR REPLACE is supported for data roles. Standard database roles do not support the REPLACE option."

  - id: create_data_grants
    badge: "2"
    label: Create data grants
    title: Create data grants
    action_ids:
      - create_data_grants
    next_hint: Run Create end users to create Marvin and Emma. The employee data grant starts wide open and can be narrowed later.
    notes:
      - "Create a SELECT data grant on CUSTOMERS for the employee data role. It starts with all rows and columns; you will narrow it on Customize Grant."
      - "A user with an active employee data role can read the data this grant authorizes. Later, you will add a row predicate and column restrictions."

  - id: create_users
    badge: "3"
    label: Create end users
    title: Create end users
    action_ids:
      - create_end_users
    next_hint: "Emma already receives the employee data role in this action. Continue to Grant Data Role to assign it to Marvin."
    notes:
      - "End users are another Deep Sec concept. Unlike traditional database users, they are schemaless: they do not own tables or other schema objects. They access data through data roles and data grants."
      - "Local end users represent people or application users inside the database. This lab creates Marvin and Emma with passwords so you can test their access directly."
      - "In an enterprise IAM deployment, users can authenticate through the identity provider instead. Oracle validates their tokens and maps the role or group claims to configured data roles."
      - "With IAM integration, your IAM team manages user membership. Database administrators still manage the data-role mappings and data grants."

  - id: grant_employee_access
    badge: "4"
    label: Grant Data Role
    title: Grant Data Role
    action_ids:
      - grant_employee_access
    next_hint: "Run Review & Quiz, then open Customer Sales App to check the baseline access."
    notes:
      - "Remember the earlier note on local versus enterprise end users? Because Marvin and Emma are local end users, you have to manually assign them the data roles you want them to have."
      - "With Microsoft Entra ID integration, you could use CREATE DATA ROLE HOL_DATAROLE_EMPLOYEE_ACCESS MAPPED TO 'AZURE_ROLE=EMPLOYEES'. After the identity provider assigns the matching application role, Oracle activates the mapped data role when it establishes the user's security context."

  - id: review
    badge: "5"
    label: Review & Quiz
    title: Review & Quiz
    action_ids:
      - review_light
    next_hint: Continue to Customer Sales App to see this access from Marvin's side.
    quiz:
      question: "Before you ran Grant Data Role, why could Marvin not query APPLAB.CUSTOMERS even though the employee data role and data grant already existed?"
      options:
        - key: not_granted
          label: "The employee data role had not yet been granted to Marvin."
        - key: copy_needed
          label: "APPLAB.CUSTOMERS first had to be copied into Marvin's own schema."
        - key: app_permission
          label: "The Customer Sales App needed a separate permission change in its code."
        - key: context_needed
          label: "Every end user must have the SELECT ANY TABLE system privilege."
      correct_answer: not_granted
      explanation: "Correct. In this lab, the employee data role supplies the login privilege and the customer data grant. Creating it alone does not assign it to Marvin; Grant Data Role does that."
    notes:
      - "Review the two data roles, the employee customer data grant, and the two end users. The baseline grant has no WHERE clause, so it authorizes all customer rows. Check that Marvin and Emma both hold the employee data role."

  - id: customer_sales
    badge: "1"
    label: Customer Sales App
    title: Customer Sales App
    action_ids:
      - customer_sales
    next_hint: Continue to Customize Data Grant to narrow the rows and columns Oracle returns to Marvin.
    quiz:
      question: "The data grant you just created has no WHERE clause at all. What does that mean for which rows Marvin can see?"
      options:
        - key: every_row
          label: "Every row is authorized because the grant has no row restriction."
        - key: no_rows
          label: "No rows are authorized until a predicate is added."
        - key: filled_columns
          label: "Only rows where every column is filled in are authorized."
        - key: own_row_default
          label: "Oracle defaults to showing just Marvin's own row."
      correct_answer: every_row
      explanation: "Correct. The WHERE clause is optional. Without it, the data grant authorizes all rows on the target object."
    notes:
      - "Sign in as Marvin with the shared lab password and select Customer Report. Use the separate private window for Emma. Both initially see all 22 customer rows. If you opened the links with the right-click menu, select Mark as viewed here before checking your quiz answer."

  - id: customize_employee_grant
    badge: "1"
    label: Customize Data Grant
    title: Customize Data Grant
    action_ids:
      - customize_employee_grant
    next_hint: Continue to Check Customer Sales App to confirm the change took effect.
    notes:
      - "Modify the employee data grant by choosing which columns to include in SELECT and UPDATE. The same grant applies to both Marvin and Emma."
      - "Restrict the rows to the signed-in salesperson. The predicate compares sales_rep with ora_end_user_context.username; neither Marvin nor Emma is hardcoded in the rule."
      - "DELETE applies to whole rows, so it has one toggle rather than a separate choice for each column."
      - "For the expected results in this lab, exclude credit_limit and sensitive_identifier from SELECT, select Restrict rows to your own sales_rep, leave every UPDATE column excluded, and leave deleting rows disabled. Keep the other SELECT columns included, then select Apply this grant. The resulting grant authorizes five columns; manager_id is not included in the employee wizard."

  - id: verify_employee_grant
    badge: "2"
    label: Check Customer Sales App
    title: Check Customer Sales App
    action_ids:
      - verify_employee_grant
    next_hint: "Continue to Review & Quiz to inspect the grant."
    quiz:
      question: "Credit Limit and Sensitive Identifier now show a dash (—) for Marvin. Why are those values unavailable?"
      options:
        - key: excluded_select
          label: "Those columns were excluded from the data grant's SELECT list."
        - key: app_hides
          label: "The application hides those two columns in its display code."
        - key: columns_gone
          label: "Those columns don't exist in the CUSTOMERS table anymore."
        - key: password_scope
          label: "Marvin's password doesn't have permission for those columns."
      correct_answer: excluded_select
      explanation: "Correct. Oracle enforces the column restrictions and does not return the protected values. SELECT * can still include those column names with NULL values; the app marks unauthorized cells with a dash."
    notes:
      - "Refresh Customer Report as Marvin. With the recommended grant, he sees three rows and five authorized columns. Select a dash in Credit Limit or Sensitive Identifier to inspect the authorization explanation. Return here, select Mark as viewed, and answer the quiz."

  - id: review_grant
    badge: "3"
    label: Review & Quiz
    title: Review & Quiz
    action_ids:
      - review_grant
    next_hint: "Continue to Context to prepare Marvin's manager access."
    quiz:
      question: After row restriction and column exclusions are applied, what stops Marvin from seeing unauthorized data?
      options:
        - key: database
          label: Oracle's Deep Data Security data grant enforcement.
        - key: application
          label: The Customer Sales App page logic.
        - key: browser
          label: The browser hiding rows and columns.
        - key: password
          label: A different password for the restricted user.
      correct_answer: database
      explanation: Correct. The database enforces the data grant, so changing or bypassing the application cannot reveal rows or columns that Oracle did not authorize.
    notes:
      - "Review the five columns authorized by the employee SELECT grant and the predicate matching sales_rep to ora_end_user_context.username. The output lists the configured column privileges and role assignments. With the recommended choices, the employee grant has no UPDATE or DELETE privilege."
      - "The output also lists data roles, ordinary database roles, and end users. End user context definitions should still be empty; you create one next."

  - id: create_managers
    badge: "1"
    label: Manager Lookup
    title: Manager Lookup
    action_ids:
      - create_managers
    next_hint: Run Manager context to build the session-scoped context that reads this lookup.
    notes:
      - "Create a lookup that maps manager names to numeric IDs: Marvin is manager 1 and Priya is manager 2. In CUSTOMERS, Emma's six rows have manager_id = 1. Marvin's three salesperson rows have no manager_id. Priya is a sample-data entry, not a local end user created by this lab."

  - id: create_manager_context
    badge: "2"
    label: Manager context
    title: Manager context
    action_ids:
      - create_manager_context
    next_hint: Run Set Context to wire up the bridge role and context access.
    notes:
      - "Create an end user context named APPLAB.MGR_CTX and a package that resolves the signed-in manager's ID. The o:onFirstRead handler runs when the context's ID is first read in a session and stores the result in session memory."
      - "End user contexts can also be used with users authenticated through enterprise IAM. Trusted attributes let a grant express rules such as manager, territory, or department access."
      - "This lab configures the handler explicitly. Oracle invokes it on the first read; the application does not need to run a separate lookup before each customer query."

  - id: set_context
    badge: "3"
    label: Set Context
    title: Set Context
    action_ids:
      - set_context
    next_hint: Run Manager Data Grant to define what a manager can see, before granting the role itself.
    notes:
      - "Give APPLAB the privilege to update the context and give both data roles permission to read it and invoke its handler package."
      - "The end users receive SELECT access to this context, not UPDATE access. The trusted APPLAB package computes the manager ID from the authenticated identity instead of accepting a value chosen in the browser."

  - id: customize_manager_grant
    badge: "4"
    label: Manager Data Grant
    title: Manager Data Grant
    action_ids:
      - customize_manager_grant
    next_hint: Run Grant Manager Role to promote Marvin now that his grant is defined.
    notes:
      - "Now that you have created the relationship between employees and managers, decide which columns the manager data role can SELECT or UPDATE, and whether it can DELETE rows."
      - "For this data grant, managers should <u>not</u> be able to SELECT sensitive_identifier."
      - "Managers <u>should</u> be able to UPDATE customer_name, region, and sales_rep."
      - "Managers should <u>not</u> be allowed to delete rows."
      - "Keep the other SELECT columns included. Watch Generated SQL as you make these choices, then select Apply this grant."

  - id: grant_manager_role
    badge: "5"
    label: Grant Manager Role
    title: Grant Manager Role
    action_ids:
      - enable_manager
      - disable_manager
    next_hint: Open the Customer Sales App as Marvin to see manager access apply.
    notes:
      - "Select Grant manager role, then refresh Customer Report as Marvin. Compare his row count and the available column values. Leave the role granted before checking the quiz answer."
      - "Applicable grants combine as a union: a row authorized by two grants appears only once. In this dataset, the employee and manager row sets do not overlap."
      - "Expected result: Marvin's 3 employee rows plus Emma's 6 team rows give 9 distinct rows. Credit Limit is visible for the 6 team rows through the manager grant, but remains unavailable on Marvin's 3 employee rows. Sensitive Identifier remains unavailable on all 9 rows."
    quiz:
      question: "With the recommended employee and manager grants active, how many customer rows does Marvin see?"
      options:
        - key: nine
          label: "9"
        - key: twenty_two
          label: "22"
        - key: three
          label: "3"
        - key: zero
          label: "0"
      correct_answer: nine
      explanation: "Correct. The employee grant authorizes Marvin's three rows. The manager grant authorizes Emma's six rows, whose manager_id is 1. These sets are disjoint, so their union contains nine rows."

  - id: review_context
    badge: "6"
    label: Review & Quiz
    title: Review & Quiz
    action_ids:
      - review_context
    next_hint: Continue to Iceberg to extend the existing customer authorization to Iceberg-backed data.
    quiz:
      question: What does the manager data grant use to determine which customer rows a manager can access?
      options:
        - key: context
          label: The authenticated user's end-user context and the manager lookup relationship.
        - key: browser
          label: The manager selected in the Customer Sales App page.
        - key: all_rows
          label: Every row in APPLAB.CUSTOMERS, because managers always have full access.
        - key: table_copy
          label: A private copy of the customer table for each manager.
      correct_answer: context
      explanation: "Correct. The context resolves the signed-in manager's ID, and the data grant matches that ID against manager_id on each customer row."
    notes:
      - "Review the two data roles and the customer data grants. The grant list on this page covers APPLAB objects. Set Context also created MGR_CTX_ACCESS on SYS.END_USER_CONTEXT; the context definition appears separately below."
      - "The manager customer grant uses ora_end_user_context.APPLAB.MGR_CTX.id in its predicate. Inspect each grant's SELECT and UPDATE permissions and its row-level DELETE status."
      - "The end user context definitions section now includes APPLAB.MGR_CTX. Answer the quiz, then continue to Iceberg."

  - id: explain_iceberg_architecture
    badge: "1"
    label: How it works
    title: How it works
    action_ids:
      - explain_iceberg_architecture
    next_hint: Continue to See the raw data to look at the actual files this diagram describes.
    notes:
      - "You have configured the main authorization policies. Next, extend them to an Apache Iceberg dataset stored in OCI Object Storage."
      - "The lab exposes those files through an Oracle external table so Deep Sec can enforce access when users query the data through Oracle."

  - id: show_iceberg_files
    badge: "2"
    label: See the raw data
    title: See the raw data
    action_ids:
      - show_iceberg_files
    next_hint: Continue to Create table to see Oracle turn these files into a queryable object.
    notes:
      - "Deployment publishes these sample files to Object Storage. The external table reads them there; creating it does not copy the dataset into database storage."

  - id: create_order_history
    badge: "3"
    label: Create table
    title: Create table
    action_ids:
      - create_order_history
    next_hint: Continue to See the data to query it with ordinary SQL.
    notes:
      - "The Iceberg metadata and data files remain in Object Storage. The external table points to the metadata so Oracle can find and query the data files."
      - "The setup supplies the required directory and network privileges. APPLAB creates the external table using the lab credential and the metadata URL in file_uri_list. These permissions allow the reader to reach the files; the cross-table data grant will authorize end-user queries."

  - id: show_order_history_data
    badge: "4"
    label: See the data
    title: See the data
    action_ids:
      - show_order_history_data
    next_hint: Continue to Extend customer access to authorize what you just saw.
    notes:
      - "The first test is querying it as the ADB's ADMIN user. ADMIN is a very powerful account, used here only to demonstrate that the external table's data is reachable through a standard SQL query."
      - "The sample contains 1,500 orders. The output shows the five most recent orders and counts by sales rep, including 395 for Emma and 223 for Marvin. Together, those two sets contain 618 orders."

  - id: extend_manager_context
    badge: "5"
    label: Extend customer access
    title: Extend customer access
    action_ids:
      - extend_manager_context
    next_hint: "Continue to Review & Quiz to inspect the cross-table grant."
    notes:
      - "Create a cross-table data grant that derives access to ORDER_HISTORY from access to CUSTOMERS."
      - "The predicate matches customer_id in ORDER_HISTORY to customer_id in CUSTOMERS. It does not need to repeat the salesperson or manager predicates."
      - "Each user can read order rows whose customer_id matches an authorized customer row. That includes the customers authorized by any applicable employee or manager grant."
      - "Select amount under Exclude from SELECT, then select Apply this grant. In the Customer Sales App, refresh Iceberg Report as Marvin with his manager role still granted."
    quiz:
      question: "After applying the cross-table grant, run Iceberg Report as Marvin with his manager role active. What total authorized row count is shown in Database Security Context?"
      options:
        - key: fifteen_hundred
          label: "1,500"
        - key: nine_hundred_forty_five
          label: "945"
        - key: six_hundred_eighteen
          label: "618"
        - key: zero
          label: "0"
      correct_answer: six_hundred_eighteen
      explanation: "Correct. Marvin is authorized for 618 orders: his 223 plus Emma's 395. The report displays the 50 most recent authorized rows and shows 618 as the total."

  - id: review_order_history
    badge: "6"
    label: Review & Quiz
    title: Review & Quiz
    action_ids:
      - review_order_history
    next_hint: Continue to Exercises.
    notes:
      - "Run the review script to inspect the external table and cross-table data grant. Deep Sec protects queries through the Oracle external table; direct access to the Object Storage files is controlled separately by OCI permissions. Answer the quiz, then continue."
    quiz:
      question: When Oracle creates APPLAB.ORDER_HISTORY, what happens to the Iceberg data?
      options:
        - key: object_storage
          label: It remains in Object Storage; Oracle queries the existing Iceberg files without copying them into database storage.
        - key: database_copy
          label: Oracle copies every Parquet file into an APPLAB table.
        - key: conversion
          label: Oracle converts the Iceberg files into an Oracle-only format.
        - key: deletion
          label: Oracle deletes the Iceberg files after importing their rows.
      correct_answer: object_storage
      explanation: Correct. ORDER_HISTORY is an external table over the existing Iceberg files; the data remains in Object Storage.

  - id: exercise_persona_compare
    badge: "1"
    label: Compare personas
    title: Compare Emma and Marvin
    notes:
      - "Compare the reports without rerunning setup actions. Rerunning a setup action can replace objects or restore broader access."
      - "Both users hold the same employee role, but its predicate uses the signed-in identity. Marvin also holds the manager role if you completed Context, which adds Emma's customer rows to his result."
    action_ids:
      - exercise_persona_compare
    next_hint: Continue to Ask AI Insights.
    quiz:
      question: "Considering only their shared employee data role, why are Emma and Marvin authorized for different customer rows?"
      options:
        - key: different_role
          label: They're actually on different data roles.
        - key: predicate
          label: The grant's row predicate matches each one's own sales_rep value.
        - key: app_logic
          label: The application filters differently per user.
        - key: random
          label: Row order is randomized per session.
      correct_answer: predicate
      explanation: "Correct. The same predicate matches sales_rep against each signed-in user's identity. Marvin's manager role can separately add team rows."

  - id: exercise_ai_insights
    badge: "2"
    label: Ask AI Insights
    title: Ask AI Insights
    notes:
      - "Feel free to navigate back through the lab at any point to jog your memory before answering."
      - "For a normal question, the backend queries CUSTOMERS again as the signed-in user and sends the authorized result to GenAI. It does not read data from the browser table. The #11 red-team challenge additionally allows a local read-only SQL check under that same user identity."
    action_ids:
      - exercise_ai_insights
    next_hint: Continue to Order history before and after.
    quiz:
      question: "For a normal customer question, what data does AI Insights send to OCI Generative AI?"
      options:
        - key: yes_more
          label: "Every customer row, including rows the signed-in user cannot query."
        - key: no_same
          label: "A fresh customer query result authorized by Oracle for the signed-in user."
        - key: depends_prompt
          label: "Whatever additional rows the wording of the question requests."
      correct_answer: no_same
      explanation: "Correct. The backend runs the customer query as the signed-in end user. With unchanged data and grants, it receives the same authorized result as Customer Report. A fabricated answer is not evidence that Oracle returned an unauthorized value."

  - id: exercise_order_history_before_after
    badge: "3"
    label: Order history before/after
    title: Order history, before and after
    notes:
      - "Feel free to navigate back through the lab at any point, Iceberg especially, to jog your memory before answering."
      - "If you already created the grant, use your earlier observation rather than resetting the lab just for this question."
    action_ids:
      - exercise_order_history_before_after
    next_hint: "Continue to Compare before/after promotion."
    quiz:
      question: Before the data grant connecting order history back to CUSTOMERS existed, what did Marvin see when he checked order history?
      options:
        - key: nothing
          label: "An access-denied result; no order rows were authorized."
        - key: everything
          label: Every order, unrestricted.
        - key: three_rows
          label: Only his own three customers' orders.
      correct_answer: nothing
      explanation: "Correct. The external table existed, but Marvin had no data grant authorizing access to it until the cross-table grant was created."

  - id: exercise_manager_promotion
    badge: "4"
    label: Compare before/after promotion
    title: Promote Marvin, then compare
    notes:
      - "On Context, use Revoke manager role and Grant manager role to compare both states. Refresh Customer Report after each action."
      - "With the recommended grants, Marvin sees 3 customer rows as an employee and 9 as a manager. These sample row sets do not overlap; the quiz asks what happens if grants overlap."
    action_ids:
      - exercise_manager_promotion
    next_hint: Continue to Try a restore.
    quiz:
      question: "If two applicable data grants authorize the same row, does Oracle return that row twice?"
      options:
        - key: yes_sum
          label: "Yes. Every grant adds another copy of the row."
        - key: no_union
          label: "No. Applicable grants combine as a union, so each row is counted once."
        - key: manager_only
          label: Only the manager grant's rows count now.
      correct_answer: no_union
      explanation: "Correct. Grants are additive: Oracle takes the union of their authorized rows and values. Overlapping grants do not duplicate a row."

  - id: exercise_reset
    badge: "5"
    label: Try a restore
    title: Use a restore option
    notes:
      - "You can review the restore descriptions without running them. Running a restore replaces the database objects and clears earlier workflow progress."
      - "Restore to DB Setup leaves the schema, sample data, and ordinary database roles. Restore to Deep Sec Setup also recreates both data roles, the baseline data grant, Marvin, and Emma."
    action_ids:
      - exercise_reset
    next_hint: "Continue to Best Practices."
    quiz:
      question: "Why does restoring this lab change what the Customer Sales App can access?"
      options:
        - key: real_objects
          label: "Restore actions drop and recreate real database objects, including roles, grants, and end users."
        - key: no_difference
          label: "It doesn't matter, restores and app resets behave identically either way."
        - key: query_cache
          label: "Oracle caches old query results that a restore has to clear separately."
        - key: server_restart
          label: "The application server needs to be manually restarted after every restore."
      correct_answer: real_objects
      explanation: "Correct. The restore scripts change the database authorization objects. After refreshing or signing in again, the application reflects the restored database state."

  - id: best_practice_authorization_model
    badge: "1"
    label: "Authorization Model"
    title: "Authorization Model"
    action_ids:
      - best_practice_authorization_model
    next_hint: Continue to End User Context.
    notes:
      - "You saw this model become concrete when the employee role, row predicate, and column choices changed Marvin's Customer Sales App result without changing the application query."
      - "Start with a decision table: who is the subject, what object is protected, which operation is allowed, which rows and columns are in scope, and what trusted attributes affect the decision."

  - id: best_practice_trusted_identity
    badge: "2"
    label: End User Context
    title: End User Context
    action_ids:
      - best_practice_trusted_identity
    next_hint: Continue to Application Connections.
    notes:
      - "In this lab, Oracle authenticates Marvin or Emma directly and establishes the end-user identity. MGR_CTX adds a trusted manager attribute to that context."
      - "Application identity and end-user identity are related but distinct. The application identity identifies the calling application; Marvin's end-user security context identifies the person whose request Oracle must authorize."
      - "The lab uses local Marvin and Emma accounts to make the result visible. In production, map enterprise IAM users and roles, then propagate the trusted end-user security context through the connection pool."

  - id: best_practice_minimal_connections
    badge: "3"
    label: Application Connections
    title: Application Connections
    action_ids:
      - best_practice_minimal_connections
    next_hint: Continue to Least Privilege.
    notes:
      - "You saw the safe boundary when the Customer Sales App issued the same query for Marvin and Oracle returned only his authorized result."
      - "A connection pool is an efficiency mechanism, not an authorization model. Do not make the pooled account a back door to every application table."
      - "For requests on behalf of a user, let the application establish trusted identity and context, while Deep Sec data roles and grants decide which data the user can read or change."

  - id: best_practice_least_privilege
    badge: "4"
    label: Least Privilege
    title: Least Privilege
    action_ids:
      - best_practice_least_privilege
    next_hint: Continue to Privilege Elevation.
    notes:
      - "With the recommended employee grant, Marvin's access changes from 22 rows with all eight columns authorized to three rows with five columns authorized. The Customer Report still uses the same query."
      - "Treat SELECT, UPDATE, INSERT, and DELETE as separate business decisions. An employee may be able to read a row without being able to update every column in it."
      - "Multiple applicable data grants combine as a union. Review the combined result, not each grant in isolation, especially when users hold more than one data role."

  - id: best_practice_trusted_context
    badge: "5"
    label: Privilege Elevation
    title: Privilege Elevation
    action_ids:
      - best_practice_trusted_context
    next_hint: Continue to Audit Policies.
    notes:
      - "Marvin's manager role and MGR_CTX demonstrate context-based access. This lab grants the manager role until you revoke it; a production elevation workflow would need additional controls for temporary access."
      - "Never treat an arbitrary browser field as a trusted authorization attribute. Validate identity and business attributes before placing them in the protected end-user context."
      - "The lab's MGR_CTX demonstrates context-driven manager access. At enterprise scale, sensitive elevation should be approved, scoped to the operation, time-limited, and auditable."

  - id: best_practice_policy_lifecycle
    badge: "6"
    label: Audit Policies
    title: Audit Policies
    action_ids:
      - best_practice_policy_lifecycle
    next_hint: Continue to Summary when you are ready.
    notes:
      - "You saw why lifecycle testing matters when the same Customer Sales App and OCI Generative AI questions produced different authorized results after each policy change."
      - "Test both sides of every policy: authorized and unauthorized users, multiple roles, role changes, pooled connections, direct access paths, and agent-assisted workflows."
      - "Audit Deep Sec administration and runtime use separately. Capture data role creation, assignment, and removal, plus data grant creation, replacement, and removal with Oracle Unified Auditing."
      - "There is no separate data-role-used event. Audit SELECT, INSERT, UPDATE, and DELETE on protected objects, then correlate END_USER_NAME and END_USER_SECURITY_CONTEXT_ID with DBA_DATA_ROLE_GRANTS and DBA_DATA_GRANTS."

  - id: what_you_proved
    badge: "1"
    label: Summary
    title: Summary
    action_ids:
      - what_you_proved
    next_hint: Use Admin to validate or reset the lab when you are ready.
    notes:
      - "The query did not become more trusted because it came from an application or an AI prompt. The result changed because Oracle evaluated the signed-in end user, active data roles, data grants, and end user context."
      - "The four result sets are the evidence to take home: broad baseline access, least-privilege employee access, the manager union, and cross-table Iceberg access."

  - id: validate_as_marvin
    badge: V
    label: Run validation
    title: Run validation
    action_ids:
      - validate_as_marvin
    next_hint: Use Reset all if you want to start the whole lab over from scratch.
    notes:
      - "The comparison reads Emma's and Marvin's data roles and grants from Oracle and shows them side by side. Run Action also executes validation SQL as Marvin."
      - "Emma remains on the employee role only, although changes to its grant affect her access too. Compare her authorization with Marvin's to see what his manager role adds."

  - id: restore_db_setup
    badge: DB
    label: Restore to DB Setup
    title: Restore to DB Setup
    notes:
      - "This action replaces the lab objects with the DB Setup baseline: APPLAB, the sample customers, and ordinary database roles. Marvin and Emma are removed. Complete Deep Sec Setup before signing in as either user again."
      - "The action runs real SQL and clears previous workflow progress. Setup actions it executes are marked complete; review actions and quizzes still need to be completed."
    action_ids:
      - restore_db_setup
    next_hint: Use Restore to Deep Sec Setup to add the baseline data roles, data grant, Marvin, and Emma.

  - id: restore_deep_sec_setup
    badge: DS
    label: Restore to Deep Sec Setup
    title: Restore to Deep Sec Setup
    notes:
      - "This action rebuilds DB Setup and then recreates both data roles, the baseline employee data grant, Marvin, and Emma. Use it to repeat Customize Grant, Context, or Iceberg from the broad-access baseline."
      - "Customized column restrictions, the manager context and grant, and order-history access are removed. The earlier setup actions are marked complete, but you must rerun review actions and quizzes."
    action_ids:
      - restore_deep_sec_setup
    next_hint: Open the Customer Sales App to continue from the baseline employee access.

  - id: download_lab_files
    badge: D
    label: Downloads
    title: Downloads
    notes:
      - "Each ZIP is built from the files currently installed on this VM, so it includes any source changes made here."
      - "Use the SQL and application source as a starting point for your own environment. Review the lab-specific names, credentials, and privileges before adapting it."
    action_ids:
      - download_lab_files

  - id: reset_lab
    badge: R
    label: Reset all
    title: Reset all
    notes:
      - "This action drops APPLAB, Marvin, Emma, and every database role and data role created by the lab. Start again with Prepare App on DB Setup."
      - "To retain a starting baseline instead, use Restore to DB Setup or Restore to Deep Sec Setup."
    action_ids:
      - reset_lab
    next_hint: "Return to DB Setup and run Prepare App to begin again."

pages:
  - id: db_setup
