  restore_deep_sec_setup:
    type: sql
    title: Restore to Deep Sec Setup
    description: "Drops this lab's objects, rebuilds DB Setup, then recreates both data roles, the baseline employee grant, Marvin, and Emma. The setup actions are marked complete; run Review & Quiz on each page to finish them."
    scripts:
