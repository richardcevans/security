      - create_roles
      - create_data_grants
      - create_users
      - grant_employee_access
      - review

  - id: customer_sales
    path: /customer-sales
    label: Customer Sales App
    step_ids:
      - customer_sales

  - id: build_grant
    path: /build-grant
    label: Customize Grant
    step_ids:
      - customize_employee_grant
      - verify_employee_grant
      - review_grant

  - id: end_user_context
    path: /end-user-context
    label: Context
    step_ids:
      - create_managers
      - create_manager_context
      - set_context
      - customize_manager_grant
      - grant_manager_role
      - review_context

  - id: order_history
    path: /order-history
    label: Iceberg
    step_ids:
      - explain_iceberg_architecture
      - show_iceberg_files
      - create_order_history
      - show_order_history_data
      - extend_manager_context
