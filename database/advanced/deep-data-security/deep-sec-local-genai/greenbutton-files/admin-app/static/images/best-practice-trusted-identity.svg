<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Trusted identity and application identity</title>
  <desc id="desc">Marvin authenticates through enterprise IAM, the Customer Sales App uses its registered application identity, and Oracle receives Marvin's end-user security context over a pooled connection.</desc>
  <rect width="960" height="300" rx="14" fill="#f7f6f4"/>
  <text x="32" y="38" fill="#312d2a" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Pass the real user through the application</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="24" y="74" width="142" height="116" rx="12" fill="#eff6ff" stroke="#005fb8" stroke-width="3"/>
    <text x="48" y="108" fill="#312d2a" font-size="20" font-weight="700">Marvin</text>
    <text x="48" y="135" fill="#625f5b" font-size="15">End user</text>
    <text x="48" y="158" fill="#625f5b" font-size="15">Salesperson</text>
    <text x="48" y="181" fill="#625f5b" font-size="15">Signs in</text>

    <line x1="177" y1="132" x2="213" y2="132" stroke="#005fb8" stroke-width="3"/>
    <polygon points="213,132 201,124 201,140" fill="#005fb8"/>
    <text x="177" y="112" fill="#625f5b" font-size="12">authenticates</text>

    <rect x="225" y="74" width="164" height="116" rx="12" fill="#fff2ef" stroke="#c74634" stroke-width="3"/>
    <text x="249" y="108" fill="#312d2a" font-size="19" font-weight="700">Enterprise IAM</text>
    <text x="249" y="136" fill="#625f5b" font-size="15">Entra ID or OCI IAM</text>
    <text x="249" y="159" fill="#625f5b" font-size="15">Identity + roles</text>
    <text x="249" y="182" fill="#625f5b" font-size="15">Trusted claims</text>

    <line x1="400" y1="132" x2="436" y2="132" stroke="#c74634" stroke-width="3"/>
    <polygon points="436,132 424,124 424,140" fill="#c74634"/>

    <rect x="448" y="64" width="202" height="136" rx="12" fill="#fff8e1" stroke="#926014" stroke-width="3"/>
    <text x="472" y="96" fill="#312d2a" font-size="19" font-weight="700">Customer Sales App</text>
    <text x="472" y="124" fill="#625f5b" font-size="15">Application identity:</text>
    <text x="472" y="146" fill="#312d2a" font-size="15" font-weight="700">sales_app</text>
    <text x="472" y="171" fill="#625f5b" font-size="15">Connection pool</text>
    <text x="472" y="193" fill="#625f5b" font-size="13">attaches end-user context</text>

    <line x1="661" y1="132" x2="697" y2="132" stroke="#926014" stroke-width="3"/>
    <polygon points="697,132 685,124 685,140" fill="#926014"/>

    <rect x="709" y="64" width="227" height="136" rx="12" fill="#eff6ff" stroke="#005fb8" stroke-width="3"/>
    <text x="733" y="96" fill="#312d2a" font-size="19" font-weight="700">Oracle AI Database</text>
    <text x="733" y="124" fill="#625f5b" font-size="15">End-user security context</text>
    <text x="733" y="148" fill="#312d2a" font-size="15" font-weight="700">user = Marvin</text>
    <text x="733" y="171" fill="#625f5b" font-size="14">roles + attributes</text>
    <text x="733" y="192" fill="#625f5b" font-size="13">Deep Sec enforces access</text>

    <rect x="24" y="230" width="912" height="42" rx="9" fill="#fff2ef" stroke="#c74634" stroke-width="2"/>
    <text x="48" y="257" fill="#7c2d22" font-size="16" font-weight="700">The pool account alone is not Marvin. Propagate the trusted end-user context.</text>
  </g>
</svg>
