title: "Deep Sec Local End-User GenAI Lab - GreenButton"
stackDescription: "Walletless TLS deployment of the Deep Sec Autonomous AI Database, application server, private Object Storage, and a dedicated Stack-created bucket containing the pre-created Order History Iceberg data."
description: "Deep Data Security demonstration using local database end user Marvin."
informationalText: "After Apply completes, use the Application Outputs below. Terraform generates one sensitive password for ADB ADMIN, JupyterLab, and Marvin; select Unlock and copy it. Enter that password for Marvin when the database setup script prompts in Task 2."
instructions: "Build and upload deep-sec-local-genai-terraform-GreenButton.zip from the GreenButton project. In OCI Resource Manager choose My configuration, set the working directory to terraform, enter the tenancy, target compartment, region, SSH public key, order_history_oci_username in <identity-domain>/<username> form, and its sensitive OCI Auth Token. Run Plan, review the successful plan, then run Apply. This Stack creates a private Stack-owned Iceberg bucket and publishes the checked-in sample during VM bootstrap; it does not require a user-owned bucket, Customer Secret Keys, manual uploads, Spark, Data Flow, or a Hadoop catalog. After Apply, select Unlock for the generated password and use the Admin Console (7778), Customer Sales (7777), and JupyterLab (8888) outputs. Verify the VM bootstrap status is COMPLETE. The first test intentionally permits browser access from 0.0.0.0/0; set a restricted browser CIDR before broader use. See Oracle's Resource Manager ZIP deployment procedure: https://docs.oracle.com/en-us/iaas/Content/ResourceManager/Tasks/create-stack-local.htm"
schemaVersion: 1.1.0
version: "20260903"
locale: "en"

variableGroups:
  - title: "Target"
    variables:
      - tenancy_ocid
      - compartment_ocid
      - region
  - title: "Autonomous AI Database"
    variables:
      - adb_db_name
      - adb_display_name
      - adb_compute_count
      - adb_storage_tbs
      - adb_license_model
  - title: "Application Server"
    variables:
      - compute_image_ocid
      - compute_shape
      - compute_ocpus
      - compute_memory_in_gbs
      - compute_display_name
      - ssh_public_key
  - title: "Trusted Browser Access"
    variables:
      - allowed_ingress_home_ip_address
      - allowed_ingress_description
      - assign_public_ip
  - title: "Order History Iceberg destination and reader credential"
    variables:
      - order_history_bucket_prefix
      - order_history_oci_username
      - order_history_oci_auth_token
  - title: "OCI Generative AI"
    variables:
      - create_genai_iam
      - genai_policy_compartment_ocid
      - genai_model_id

variables:
  tenancy_ocid:
    type: string
    title: "Tenancy OCID"
    required: true
  compartment_ocid:
    type: oci:identity:compartment:id
    title: "Lab compartment"
    description: "Select DBSec_Rich for the intended GreenButton deployment. OCI requires the compartment OCID, so a safe name-only default is not possible."
    required: true
  region:
    type: oci:identity:region:name
    title: "Region"
    required: true
  oci_profile:
    type: string
    title: "Retired OCI CLI profile"
    description: "Not used by Resource Manager."
    visible: false
    required: false
  adb_db_name:
    type: string
    title: "ADB database name override"
    description: "Leave blank to generate a unique DEEPSEC-prefixed database name. The lab still connects through deepsec_low."
    required: false
  adb_display_name:
    type: string
    title: "ADB display name"
    required: false
  adb_compute_count:
    type: integer
    title: "ADB ECPU count"
    required: false
  adb_storage_tbs:
    type: integer
    title: "ADB storage (TB)"
    required: false
  adb_license_model:
    type: enum
    title: "ADB license model"
    enum: ["BRING_YOUR_OWN_LICENSE", "LICENSE_INCLUDED"]
    required: false
  compute_image_ocid:
    type: oci:core:image:id
    title: "Application-server image"
    required: false
    dependsOn:
      compartmentId: ${compartment_ocid}
  compute_shape:
    type: oci:core:instanceshape:name
    title: "Compute shape"
    required: false
    dependsOn:
      compartmentId: ${compartment_ocid}
  compute_ocpus:
    type: integer
    title: "Compute OCPUs"
    required: false
  compute_memory_in_gbs:
    type: integer
    title: "Compute memory (GB)"
    required: false
  compute_display_name:
    type: string
    title: "Compute display name"
    description: "Display name for the Flask compute instance."
    default: "deep-sec-app-server"
    required: false
  ssh_public_key:
    type: oci:core:ssh:publickey
    title: "SSH public key"
    description: "Public key for the person operating this stack. This shared package does not supply a maintainer key."
    required: true
  allowed_ingress_home_ip_address:
    type: string
    title: "Home public IPv4 address or CIDR"
    description: "Enter a browser public IPv4 address or CIDR. A bare address is treated as /32."
    default: "0.0.0.0/0"
    required: true
  allowed_ingress_description:
    type: string
    title: "Trusted ingress description"
    default: "Wide Open"
    required: false
  assign_public_ip:
    type: boolean
    title: "Assign public IP"
    required: false
  order_history_oci_username:
    type: string
    title: "ADB Iceberg reader username"
    description: "Identity-domain user in <identity-domain>/<username> form. APPLAB uses this identity to create the DBMS_CLOUD reader credential for the published Iceberg metadata."
    required: true
  order_history_oci_auth_token:
    type: string
    title: "ADB Iceberg reader Auth Token"
    description: "Auth Token for the named identity-domain user. Enter it as a sensitive Stack value; never put it in source control or a tfvars file."
    sensitive: true
    required: true
  order_history_access_key:
    type: string
    title: "Retired Customer Secret Key access key"
    description: "Retained compatibility input. The normal GreenButton path uses the Stack-created bucket and Stack PARs instead."
    visible: false
    required: false
  order_history_secret_key:
    type: string
    title: "Retired Customer Secret Key secret"
    description: "Retained compatibility input. The normal GreenButton path uses the Stack-created bucket and Stack PARs instead."
    sensitive: true
    visible: false
    required: false
  order_history_bucket_prefix:
    type: string
    title: "Order History bucket prefix"
    description: "Prefix for the pre-created Iceberg table in the dedicated Stack-created bucket."
    default: "order_history_iceberg"
    required: false
  create_genai_iam:
    type: boolean
    title: "Create new GenAI and ADB dynamic groups (off by default)"
    description: "Leave off for the first deployment. OCI limits a tenancy to 50 dynamic groups; use a consolidated existing group before enabling this option."
    required: false
  genai_policy_compartment_ocid:
    type: string
    title: "GenAI policy compartment OCID"
    required: false
  genai_model_id:
    type: string
    title: "On-demand GenAI model ID"
    required: false
  vcn_cidr:
    type: string
    title: "Retired VCN CIDR"
    visible: false
    required: false
  public_subnet_cidr:
    type: string
    title: "Retired public subnet CIDR"
    visible: false
    required: false
  vcn_dns_label:
    type: string
    title: "Retired VCN DNS label"
    visible: false
    required: false
  wallet_bucket_name:
    type: string
    title: "Retired application bucket override"
    visible: false
    required: false
  wallet_par_ttl_hours:
    type: integer
    title: "Retired PAR lifetime"
    visible: false
    required: false
  genai_dynamic_group_name:
    type: string
    title: "Retired GenAI dynamic group name"
    visible: false
    required: false
  genai_policy_name:
    type: string
    title: "Retired GenAI policy name"
    visible: false
    required: false

outputs:
  adb_console_url:
    type: link
    title: "Autonomous AI Database"
    displayText: "Open Deep Sec in OCI Console"
  lab_admin_jupyter_password:
    type: copyableString
    title: "ADB ADMIN, JupyterLab, and Marvin password"
    sensitive: true
  flask_url:
    type: link
    title: "Deep Data Security App"
    displayText: "Open Deep Data Security App"
  admin_console_url:
    type: link
    title: "Deep Sec DEMO Setup"
    displayText: "Open Deep Sec DEMO Setup"
  jupyter_url:
    type: link
    title: "JupyterLab"
    displayText: "Open JupyterLab"
  adb_db_name:
    type: copyableString
    title: "ADB DB name"
  adb_tls_connection_string:
    type: copyableString
    title: "ADB LOW TLS descriptor"
  adb_ocid:
    type: copyableString
    title: "ADB OCID"
  compute_instance_ocid:
    type: copyableString
    title: "Application-server OCID"
  compute_public_ip:
    type: copyableString
    title: "Application-server public IP"
  compute_private_ip:
    type: copyableString
    title: "Application-server private IP"
  ssh_command:
    type: copyableString
    title: "SSH command"
  vcn_ocid:
    type: copyableString
    title: "VCN OCID"
  public_subnet_ocid:
    type: copyableString
    title: "Public subnet OCID"
  trusted_ingress_cidr:
    type: copyableString
    title: "Trusted ingress CIDR"
  genai_model_id:
    type: copyableString
    title: "Default GenAI model"
  genai_dynamic_group_name:
    type: copyableString
    title: "GenAI dynamic group"
  genai_policy_name:
    type: copyableString
    title: "GenAI policy"

primaryOutputButton: ${admin_console_url}

outputGroups:
  - title: "Start the Lab"
    outputs:
      - ${admin_console_url}
      - ${adb_console_url}
      - ${lab_admin_jupyter_password}
      - ${flask_url}
      - ${jupyter_url}
  - title: "Database"
    outputs:
      - ${adb_db_name}
      - ${adb_tls_connection_string}
      - ${adb_ocid}
  - title: "Application Server"
    outputs:
      - ${compute_instance_ocid}
      - ${compute_public_ip}
      - ${compute_private_ip}
      - ${ssh_command}
  - title: "Network"
    outputs:
      - ${vcn_ocid}
      - ${public_subnet_ocid}
      - ${trusted_ingress_cidr}
  - title: "OCI Generative AI"
    outputs:
      - ${genai_model_id}
      - ${genai_dynamic_group_name}
      - ${genai_policy_name}
