title: DeepSec MCP Oracle Corporate Base DB System Sandbox
description: Provision Database Tools MCP Server resources for an existing Oracle Base Database System.
stackDescription: Creates participant compartments, Object Storage buckets, optional Vault secret, optional Database Tools connections, and optional MCP Servers for a fixed existing Base Database System.
schemaVersion: 1.1.0
version: "20260710"
locale: "en"

variableGroups:
  - title: OCI Context
    visible: true
    variables:
      - parent_compartment_ocid
      - tenancy_ocid
      - region

  - title: Workshop Reservation
    visible: true
    variables:
      - name_prefix
      - reservation_id
      - ttl

  - title: Participant Generation
    visible: true
    variables:
      - participant_count
      - participant_prefix
      - participant_start_number

  - title: Existing Base Database System
    visible: true
    variables:
      - base_db_system_ocid
      - base_database_ocid
      - base_db_connection_string

  - title: Database Tools MCP Server
    visible: true
    variables:
      - create_database_tools_vault_secret
      - database_tools_vault_type
      - database_tools_existing_password_secret_id
      - create_database_tools_connections
      - database_tools_connection_user_name
      - database_tools_connection_password
      - database_tools_private_endpoint_ocid
      - database_tools_related_resource_entity_type
      - database_tools_related_resource_ocid
      - create_mcp_servers
      - identity_domain_ocid
      - enable_database_tools_policy
      - database_tools_resource_family
      - mcp_server_type
      - mcp_server_storage_type
      - mcp_server_runtime_identity
      - mcp_access_token_expiry_in_seconds
      - mcp_refresh_token_expiry_in_seconds

  - title: Optional Policies and Tags
    visible: true
    variables:
      - enable_participant_compartment_policies
      - enable_tenancy_policies
      - enable_generative_ai_policy

variables:
  parent_compartment_ocid:
    type: oci:identity:compartment:id
    required: true
    title: Parent Compartment
    description: Select the parent compartment where participant compartments and support resources are created.

  tenancy_ocid:
    type: string
    required: true
    title: Tenancy OCID
    description: OCI tenancy OCID. Resource Manager may pre-populate this value.

  region:
    type: oci:identity:region:name
    required: true
    title: Region
    description: Region where the sandbox resources are deployed.

  name_prefix:
    type: string
    required: true
    title: Resource Name Prefix
    description: Prefix for workshop resources.
    default: deepsec-mcp-ora-corp-base-db

  reservation_id:
    type: string
    required: true
    title: Reservation ID
    description: LiveLabs reservation or event identifier used for tags and teardown.
    default: tbd

  ttl:
    type: string
    required: true
    title: Teardown Marker
    description: Teardown target date or marker.
    default: tbd

  participant_count:
    type: number
    required: true
    title: Participant Count
    description: Number of generated participant sandboxes to create.
    default: 1
    minimum: 1
    maximum: 500

  participant_prefix:
    type: string
    required: true
    title: Participant Prefix
    description: Prefix for generated participant keys, for example U creates U12345.
    default: U

  participant_start_number:
    type: number
    required: true
    title: Participant Start Number
    description: First number used for generated participant keys.
    default: 12345
    minimum: 1

  base_db_system_ocid:
    type: string
    required: true
    title: Base Database System OCID
    description: Existing Oracle Base Database System used as the Database Tools related resource.
    default: ocid1.dbsystem.oc1.iad.replace

  base_database_ocid:
    type: string
    required: true
    title: Database OCID
    description: Existing database OCID inside the Base Database System.
    default: ocid1.database.oc1.iad.replace

  base_db_connection_string:
    type: string
    required: true
    title: Base Database Connect String
    description: Oracle Net connect string for the database service, for example host:1521/service_name or a full DESCRIPTION string.
    default: replace-host.example.com:1521/replace-service.example.com

  create_mcp_servers:
    type: boolean
    required: true
    title: Create MCP Servers
    description: Enable after Database Tools connections exist or after generated connections are enabled.
    default: false

  create_database_tools_vault_secret:
    type: boolean
    required: true
    title: Create Database Tools Password Secret
    description: Creates one Vault, key, and secret for Database Tools connection credentials.
    default: false

  database_tools_vault_type:
    type: enum
    required: true
    title: Database Tools Vault Type
    default: DEFAULT
    enum:
      - DEFAULT
      - VIRTUAL_PRIVATE

  database_tools_existing_password_secret_id:
    type: string
    required: false
    title: Existing Database Tools Password Secret OCID
    description: Optional existing Vault secret OCID. Leave empty when creating the password secret in this stack.

  create_database_tools_connections:
    type: boolean
    required: true
    title: Create Database Tools Connections
    description: Creates one Database Tools connection per participant against the existing Base Database System.
    default: false

  database_tools_connection_user_name:
    type: string
    required: true
    title: Database Tools Connection User
    description: Use a least-privilege database user for workshop access.
    default: ADMIN

  database_tools_connection_password:
    type: password
    required: false
    title: Database Tools Connection Password
    description: Password stored in the generated Vault secret when Create Database Tools Password Secret is enabled.

  database_tools_private_endpoint_ocid:
    type: string
    required: false
    title: Database Tools Private Endpoint OCID
    description: Optional Database Tools private endpoint OCID when the Base Database System listener is reachable only through a private network path.

  database_tools_related_resource_entity_type:
    type: enum
    required: true
    title: Database Tools Related Resource Type
    description: DATABASE is preferred when the database OCID is known. Use DB_SYSTEM only if required by the service.
    default: DATABASE
    enum:
      - DATABASE
      - DB_SYSTEM

  database_tools_related_resource_ocid:
    type: string
    required: false
    title: Database Tools Related Resource OCID Override
    description: Optional override. Leave empty to use the Database OCID, then the DB System OCID.

  identity_domain_ocid:
    type: oci:identity:domains:id
    required: false
    title: Identity Domain OCID
    description: Required when creating MCP servers.
    dependsOn:
      compartmentId: tenancy_ocid

  database_tools_resource_family:
    type: enum
    required: true
    title: Database Tools Policy Resource Family
    description: Validate the exact policy family name with LiveLabs/OCI before production use.
    default: database-tools-family
    enum:
      - database-tools-family
      - dbtools-family

  enable_database_tools_policy:
    type: boolean
    required: true
    title: Enable Database Tools Policy Statements
    description: Enable only after the exact Database Tools policy resource family is confirmed for the tenancy.
    default: false

  enable_participant_compartment_policies:
    type: boolean
    required: true
    title: Enable Participant Group Policies
    description: Leave unchecked in Oracle corporate tenancies when you use existing user permissions and cannot create workshop users or groups.
    default: false

  mcp_server_type:
    type: enum
    required: true
    title: MCP Server Type
    default: DEFAULT
    enum:
      - DEFAULT
    visible: create_mcp_servers

  mcp_server_storage_type:
    type: enum
    required: true
    title: MCP Server Storage Type
    default: OBJECT_STORAGE
    enum:
      - OBJECT_STORAGE
    visible: create_mcp_servers

  mcp_server_runtime_identity:
    type: string
    required: false
    title: MCP Server Runtime Identity
    description: Optional runtime identity, for example RESOURCE_PRINCIPAL. Leave empty to use the service default.
    visible: create_mcp_servers

  mcp_access_token_expiry_in_seconds:
    type: number
    required: false
    title: MCP Access Token Expiry Seconds
    visible: create_mcp_servers

  mcp_refresh_token_expiry_in_seconds:
    type: number
    required: false
    title: MCP Refresh Token Expiry Seconds
    visible: create_mcp_servers

  enable_generative_ai_policy:
    type: boolean
    required: true
    title: Enable Generative AI Policy
    description: Enable if the simple AI app uses OCI Generative AI.
    default: false

  enable_tenancy_policies:
    type: boolean
    required: true
    title: Enable Tenancy Scope Policies
    description: Enable only if the Resource Manager principal can manage policies in the tenancy root compartment.
    default: false
