[project]
name = "oracle-sql-mcp"
version = "0.1.0"
description = "MCP server for OCI IAM-authenticated Oracle SQL access"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.26,<2",
  "oci>=2.180,<3",
  "oracledb>=3.4,<4",
  "python-dotenv>=1.1,<2",
]

[project.scripts]
oracle-sql-mcp = "oracle_sql_mcp.server:main"
oracle-sql-chat = "oracle_sql_mcp.client_app:main"

[tool.setuptools.packages.find]
where = ["src"]
